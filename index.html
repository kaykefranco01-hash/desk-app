<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title>Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="err" class="err" hidden></div>
<div id="demo-bar" class="demo-bar" role="status" aria-live="polite" hidden><div id="demo-t" class="demo-t"></div><div id="demo-s" class="demo-s"></div><div class="demo-pb"><i id="demo-p"></i></div></div>
<main id="view">
  <!-- HOME -->
  <section id="tab-home" class="tab">
    <header class="nav">
      <button class="avatar" data-go="account" aria-label="Account"><span>K</span></button>
      <button class="brand" data-go="agents">Grok Bot <span class="chev">›</span></button>
      <button class="icon-btn" id="btn-search" aria-label="Search"><i class="i-search"></i></button>
      <button class="icon-btn" id="btn-bell" aria-label="Notifications"><i class="i-bell"></i><b id="bell-dot" class="bell-dot" hidden></b></button>
    </header>
    <div class="err-slot"></div>
    <div class="bal-row">
      <div id="balance" class="balance num skel" aria-live="polite">$000.00</div>
      <span id="paper" class="pill-paper" hidden>PAPER</span>
    </div>
    <div class="sub-row"><span id="today" class="num today skel-i">+0.00%</span><span id="mult" class="pill-mult num skel-i">1.00×</span></div>
    <div class="chart-wrap" id="chart-wrap"><canvas id="chart" aria-label="Balance chart"></canvas>
      <div id="chart-empty" class="chart-empty" hidden>Waiting for the first trade</div></div>
    <div class="ranges" id="ranges"><button class="on" data-r="LIVE">LIVE</button><button data-r="1H">1H</button><button data-r="4H">4H</button><button data-r="1D">1D</button><button data-r="1W">1W</button><button data-r="ALL">ALL</button></div>
    <h2 class="h2 row-h ag-h">Agents <span class="ag-run green"><span id="agents-running" class="num skel-i">5</span> running</span></h2>
    <div id="carousel" class="carousel" aria-label="Agents"></div>
    <div id="car-dots" class="car-dots" aria-hidden="true"></div>
    <h2 class="h2 row-h">Activity <button class="see-all" data-go="activity">See all</button></h2>
    <div id="home-activity" class="list"></div>
    <div class="meta ter small">Last update <span id="updated" class="num">—</span></div>
  </section>
  <!-- AGENTS -->
  <section id="tab-agents" class="tab" hidden>
    <header class="nav"><div class="title">Agents</div></header>
    <div class="err-slot"></div>
    <div id="agents-list" class="stack"></div>
  </section>
  <!-- ACTIVITY -->
  <section id="tab-activity" class="tab" hidden>
    <header class="nav"><div class="title">Activity</div></header>
    <div class="err-slot"></div>
    <div id="activity-list" class="list"></div>
    <button id="activity-more" class="btn-secondary" hidden>Load older</button>
  </section>
  <!-- ACCOUNT -->
  <section id="tab-account" class="tab" hidden>
    <header class="nav"><div class="title">Account</div></header>
    <div class="err-slot"></div>
    <div id="account-body"></div>
  </section>
  <!-- PUSHED SCREENS -->
  <section id="scr-coin" class="tab screen" hidden>
    <header class="nav nav-push"><button class="back" data-back aria-label="Back">‹</button><div class="nav-t" id="coin-navt"></div><span id="coin-paper" class="pill-paper" hidden>PAPER</span></header>
    <div class="err-slot"></div>
    <div id="coin-body"></div>
  </section>
  <section id="scr-audit" class="tab screen" hidden>
    <header class="nav nav-push"><button class="back" data-back aria-label="Back">‹</button><div class="nav-t">Auditor</div></header>
    <div class="err-slot"></div>
    <div id="audit-body"></div>
  </section>
  <section id="scr-search" class="tab screen" hidden>
    <header class="nav nav-push"><button class="back" data-back aria-label="Back">‹</button>
      <input id="search-in" class="search-in" placeholder="Name, symbol or mint" autocomplete="off" autocapitalize="off" spellcheck="false"></header>
    <div id="search-list" class="list"></div>
  </section>
  <section id="scr-bell" class="tab screen" hidden>
    <header class="nav nav-push"><button class="back" data-back aria-label="Back">‹</button><div class="nav-t">Notifications</div></header>
    <div class="err-slot"></div>
    <div id="bell-list" class="list"></div>
  </section>
</main>
<nav class="tabbar" id="tabbar">
  <button data-go="home" class="on"><i class="ic ic-home"></i>Home</button>
  <button data-go="agents"><i class="ic ic-agents"></i>Agents</button>
  <button data-go="activity"><i class="ic ic-activity"></i>Activity</button>
  <button data-go="account"><i class="ic ic-account"></i>Account</button>
</nav>
<div id="toast" class="toast" hidden></div>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
